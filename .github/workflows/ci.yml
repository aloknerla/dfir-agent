name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and type-check
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install lint tooling
        run: python -m pip install -c constraints.txt ruff mypy

      - name: Lint (ruff)
        run: ruff check src tests

      - name: Static types (mypy)
        run: mypy src

  test:
    name: Unit tests
    runs-on: ubuntu-24.04
    # The install below has twice stalled on an unreachable Ubuntu mirror and
    # consumed the entire 20-minute budget before pytest ever started. The cache
    # keeps that off the normal path; this headroom keeps a cold cache on a slow
    # day from turning into the same total failure.
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Which .deb files apt has to fetch depends on what the runner image
      # already carries, so the cache is keyed on the exact image as well as on
      # the package list. A new image snapshot or an edited list misses the
      # cache and installs from the archives again, which is always correct.
      - name: Identify the runner image
        id: runner-image
        shell: bash
        run: |
          set -euo pipefail
          . /etc/os-release
          echo "tag=${ID}-${VERSION_ID}-${ImageVersion:-unpinned}" >> "$GITHUB_OUTPUT"

      # actions/cache is GitHub's own action, already trusted here alongside
      # checkout and setup-python, so this adds no third-party code to a public
      # repository.
      - name: Cache native forensic packages
        uses: actions/cache@v4
        with:
          path: ~/native-packages
          key: native-packages-${{ steps.runner-image.outputs.tag }}-${{ hashFiles('.github/native-packages.txt') }}

      - name: Install native forensic libraries
        shell: bash
        run: |
          set -euo pipefail

          cache_dir="$HOME/native-packages"
          stamp="$cache_dir/.complete"
          packages=$(grep -vE '^[[:space:]]*(#|$)' .github/native-packages.txt)

          # A mirror that goes dark now fails over in seconds instead of hanging
          # the job, which is the failure these options exist to prevent.
          apt_opts=(
            -o Acquire::Retries=3
            -o Acquire::http::Timeout=20
            -o Acquire::https::Timeout=20
          )

          # A warm cache installs from disk and never contacts a mirror at all.
          # The stamp file marks a cache that a full install actually completed,
          # so a partial or empty restore falls through instead of half-working.
          install_from_cache() {
            [ -f "$stamp" ] || return 1
            local debs=("$cache_dir"/*.deb)
            [ -e "${debs[0]}" ] || return 1
            echo "Cache hit: installing ${#debs[@]} package files from disk."
            sudo dpkg --install "${debs[@]}"
          }

          # A cold cache installs normally and leaves the downloaded .deb files
          # behind for the next run to pick up.
          install_from_archives() {
            echo "Installing from the Ubuntu archives and filling the cache."
            rm -rf "$cache_dir"
            mkdir -p "$cache_dir/partial"
            sudo apt-get "${apt_opts[@]}" update
            sudo apt-get "${apt_opts[@]}" install -y --no-install-recommends \
              -o Dir::Cache::archives="$cache_dir" \
              -o APT::Keep-Downloaded-Packages=true \
              $packages
            sudo chown -R "$(id -u):$(id -g)" "$cache_dir"
            rm -rf "$cache_dir/partial" "$cache_dir/lock"
            touch "$stamp"
          }

          install_from_cache || install_from_archives

          # Whichever path ran, the libraries the bindings compile against have
          # to be present, or the build failure later would be a puzzle.
          dpkg-query --show --showformat='installed: ${Package} ${Version}\n' $packages

      - name: Install package and test tooling
        run: python -m pip install -c constraints.txt -e ".[dev]"

      - name: Unit tests (pytest)
        run: PYTHONPATH=src pytest -q

      # The console suite guards itself with `pytest.importorskip("textual")`, so a
      # missing dependency turns it green by skipping it instead of failing. Import
      # textual explicitly and reject a run that skipped rather than executed.
      - name: Console tests must actually run
        shell: bash
        run: |
          python -c "import textual"
          PYTHONPATH=src pytest tests/test_tui_console.py -q -rs | tee console-suite.log
          if tail -3 console-suite.log | grep -qE '[0-9]+ skipped|no tests ran'; then
            echo "::error::the console suite skipped instead of running"
            exit 1
          fi

  docker-console:
    name: Build console image
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Build the console target
        run: docker build --target console --tag dfir-agent-console:ci --file deploy/Dockerfile .
